<style>
/* Layout: como Onform y Casa Momo. Vídeo real de León a pantalla completa y CAZURRONICS gigante pegado abajo;
   al deslizar, el vídeo se curva y se va, y la cámara entra en la O (la rosa de verdad) hasta que es la ruleta.
   Un solo tema, oscuro a propósito. Todo el movimiento va con el dedo (scroll), no solo. */
:root {
  --noche: #07060a;
  --crema: #f3ead8;
  --gris: #a39c90;
  --oro: #e9b44c;
  --letra: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  color-scheme: dark;
}
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { margin: 0; background: var(--noche); color: var(--crema); font-family: var(--letra); -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
/* el recorrido del scroll: la escena se queda fija mientras bajas */
.recorrido { height: 260vh; height: 260svh; }
.escena { position: fixed; inset: 0; overflow: hidden; }

/* ── Vídeo ── */
.video { position: absolute; inset: 0; will-change: transform, clip-path; }
.video video, .video img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.video::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,6,10,.55), rgba(7,6,10,0) 45%); } /* velo neutro bajo el texto */

/* ── La palabra (se maqueta a tamaño final y la cámara la reduce) ── */
.plano { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.marca { margin: 0; display: flex; align-items: center; white-space: nowrap; font-weight: 900; font-stretch: 62%; letter-spacing: -.01em; line-height: .8; text-transform: uppercase; }
.marca .l { display: inline-block; }
#o { position: relative; display: inline-block; width: .74em; height: .74em; margin: 0 .02em; flex: none; border-radius: 50%; touch-action: none; }
#o::after { content: ""; position: absolute; inset: -10%; border-radius: 50%; } /* el anillo con los nombres también se puede tocar */
#rosa { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; will-change: transform; transition: scale 140ms ease-out; box-shadow: 0 0 0 .012em rgba(243,234,216,.9); }
#dial { position: absolute; inset: -9%; width: 118%; height: 118%; pointer-events: none; will-change: transform; opacity: 0; transition: scale 140ms ease-out; }
.sombra { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; opacity: 0;
  background: conic-gradient(from calc(var(--ancho, 120deg) / -2), transparent 0 var(--ancho, 120deg), rgba(7,6,10,.6) calc(var(--ancho, 120deg) + 6deg) calc(360deg - 6deg), transparent 360deg);
  -webkit-mask: radial-gradient(circle, transparent 14%, #000 17%); mask: radial-gradient(circle, transparent 14%, #000 17%); }

/* ── Textos de la portada ── */
/* la invitación a deslizar: centrada sobre la palabra, con una flecha que sube como el gesto que pide */
.desliza { position: absolute; z-index: 3; left: 50%; transform: translate(-50%, -100%); display: grid; justify-items: center; gap: 6px;
  background: none; border: 0; padding: 8px 18px; font-family: inherit; color: var(--crema); cursor: pointer; text-shadow: 0 1px 12px rgba(7,6,10,.55); }
.desliza b { font-size: 18px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.desliza svg { width: 26px; height: 26px; animation: sube 1.8s cubic-bezier(.45, 0, .2, 1) infinite; filter: drop-shadow(0 1px 8px rgba(7,6,10,.5)); }
@keyframes sube { 0%, 100% { transform: translateY(5px); opacity: .55; } 50% { transform: translateY(-5px); opacity: 1; } }
@media (hover: hover) and (pointer: fine) { .desliza:hover b { text-decoration: underline; text-underline-offset: 4px; } }

/* ── La ruleta ── */
.ui { position: absolute; inset: 0; z-index: 3; display: grid; grid-template-rows: 1fr auto; justify-items: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 64px max(24px, env(safe-area-inset-bottom, 0px)); }
.hueco { width: max(220px, min(80vw, calc(100svh - 400px), 440px)); aspect-ratio: 1; max-width: 100%; align-self: center; position: relative; }
.aguja { position: absolute; left: 50%; top: calc(-9% - 18px); width: 2px; height: 14px; margin-left: -1px; background: var(--oro); border-radius: 2px; opacity: 0; transition: transform 120ms var(--ease-out); }
.aguja.tic { transform: translateY(-3px); }
.panel { display: grid; justify-items: center; gap: 14px; text-align: center; width: min(100%, 440px); opacity: 0; pointer-events: none; }
.nombre { margin: 0; font-weight: 900; font-stretch: 62%; text-transform: uppercase; font-size: clamp(64px, 21vw, 104px); line-height: .82; letter-spacing: -.01em; }
.frase { margin: 0; font-size: 18px; line-height: 1.35; max-width: 26ch; min-height: 2.7em; text-wrap: balance; }
.frase span { display: inline-block; opacity: .18; transition: opacity 260ms ease; }
.frase span.on { opacity: 1; }
.fila { display: flex; align-items: center; gap: 16px; }
.puntos { display: flex; }
.punto { width: 30px; height: 44px; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
.punto::after { content: ""; width: 6px; height: 6px; border-radius: 99px; background: #3c3833; transition-property: width, background-color; transition-duration: 300ms; transition-timing-function: var(--ease-out); }
.punto[aria-current="true"]::after { width: 22px; background: var(--crema); }
.entrar { font: inherit; font-size: 16px; font-weight: 700; height: 52px; padding: 0 30px; border-radius: 999px; border: 0; cursor: pointer; background: var(--crema); color: var(--noche); transition-property: transform, opacity, background-color; transition-duration: 160ms; transition-timing-function: ease-out; }
@media (hover: hover) and (pointer: fine) { .entrar:hover { background: #fffaf0; } }
.entrar:active { transform: scale(.97); }
.entrar:disabled { opacity: .35; cursor: default; transform: none; }
.entrar:focus-visible, .punto:focus-visible, #o:focus-visible, .desliza:focus-visible { outline: 2px solid var(--oro); outline-offset: 4px; }
.pista { font-size: 13px; color: var(--gris); }
.creditos { position: absolute; z-index: 3; left: 0; right: 0; bottom: max(2px, env(safe-area-inset-bottom, 0px)); margin: 0; padding: 0 16px; text-align: center; font-size: 10px; line-height: 2.4; color: #6d675e; opacity: 0; pointer-events: none; }
.creditos a { color: inherit; text-decoration: none; padding: 8px 2px; }
@media (hover: hover) and (pointer: fine) { .creditos a:hover { color: var(--gris); text-decoration: underline; } }

@media (prefers-reduced-motion: reduce) { .desliza svg { animation: none; } .frase span { transition: none; } }
</style>
</head>
<body>

<div class="recorrido" id="recorrido"></div>
<div class="escena" id="escena">
  <div class="video" id="video">
    <img src="/inicio/leon-poster.jpg" alt="">
    <video id="clip" src="/inicio/leon.mp4" poster="/inicio/leon-poster.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
  </div>

  <div class="plano" id="plano">
    <h1 class="marca" id="marca" aria-label="Cazurronics"><span class="l">C</span><span class="l">a</span><span class="l">z</span><span class="l">u</span><span class="l">r</span><span class="l">r</span><span id="o" tabindex="-1" role="slider" aria-label="Gira la rosa para elegir sección"><img id="rosa" src="/inicio/rosa.jpg" alt="" draggable="false"><span class="sombra" id="sombra"></span><canvas id="dial"></canvas></span><span class="l">n</span><span class="l">i</span><span class="l">c</span><span class="l">s</span></h1>
  </div>

  <button class="desliza" id="desliza" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg><b>Desliza hacia arriba</b></button>

  <main class="ui" id="ui">
    <div class="hueco" id="hueco"><span class="aguja" id="aguja"></span></div>
    <section class="panel" id="panel" aria-live="polite">
      <h2 class="nombre" id="nombre">Planner</h2>
      <p class="frase" id="frase"></p>
      <div class="puntos" id="puntos"></div>
      <button class="entrar" id="entrar" type="button">Entrar</button>
      <span class="pista">Gira la rosa o toca una opción</span>
    </section>
  </main>
  <p class="creditos" id="creditos">Imágenes: Wikimedia Commons (CC BY-SA / CC BY), Pexels y Pixabay · <a href="/aviso-legal">Aviso legal</a> · <a href="/privacidad">Privacidad</a> · <a href="/cookies">Cookies</a></p>
</div>

<script src="/inicio/comun.js"></script>
<script src="/inicio/rosa.js"></script>
<script>
const SECCIONES = [
  { nombre: "Planner",  completo: "Cazurronics Planner",        frase: "Dinos qué te apetece y te montamos el plan en León." },
  { nombre: "Despensa", completo: "La despensa de Cazurronics", frase: "Lo mejor de la tierra leonesa, del productor a tu mesa." },
  { nombre: "Pronto",   completo: "Próxima sección",            frase: "Lo próximo de Cazurronics irá aquí.", pronto: true },
];
const N = SECCIONES.length, PASO = 360 / N;
const $ = (id) => document.getElementById(id);
const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
const plano = $("plano"), marca = $("marca"), o = $("o"), rosa = $("rosa"), dial = $("dial"), video = $("video");
ponerRosaSimetrica(rosa); // la foto está algo girada: se recompone recta y simétrica
$("sombra").style.setProperty("--ancho", PASO + "deg");

/* ═══════════ Anillo con los nombres y varillas de oro (gira con la rosa) ═══════════ */
function pintarDial(px) {
  const c = dial.getContext("2d"); dial.width = dial.height = px;
  const R = px / 2, rr = R / 1.18; c.setTransform(1, 0, 0, 1, R, R); c.clearRect(-R, -R, px, px);
  const r0 = rr * 1.015, r1 = R * .985;
  c.beginPath(); c.arc(0, 0, r1, 0, Math.PI * 2); c.arc(0, 0, r0, 0, Math.PI * 2, true); c.fillStyle = "#07060a"; c.fill("evenodd");
  c.strokeStyle = "rgba(233,180,76,.55)"; c.lineWidth = Math.max(1, R * .004);
  c.beginPath(); c.arc(0, 0, r1, 0, Math.PI * 2); c.stroke();
  for (let i = 0; i < N; i++) {
    const t = ((i + .5) * PASO - 90) * Math.PI / 180;
    c.strokeStyle = "rgba(233,180,76,.9)"; c.lineWidth = R * .006; c.lineCap = "round";
    c.beginPath(); c.moveTo(Math.cos(t) * rr * .2, Math.sin(t) * rr * .2); c.lineTo(Math.cos(t) * r1, Math.sin(t) * r1); c.stroke();
  }
  const tam = R * .058; c.font = `800 ${tam}px Archivo, "Helvetica Neue", Arial, sans-serif`; try { c.fontStretch = "condensed"; } catch {}
  c.fillStyle = "#f3ead8"; c.textAlign = "center"; c.textBaseline = "middle";
  const rt = (r0 + r1) / 2, esp = tam * .35;
  SECCIONES.forEach((s, i) => {
    const txt = s.nombre.toUpperCase(), an = [...txt].map((ch) => c.measureText(ch).width + esp), tot = an.reduce((a, b) => a + b, 0) - esp;
    let ang = i * PASO * Math.PI / 180 - tot / 2 / rt;
    [...txt].forEach((ch, k) => { const m = (an[k] - esp) / 2; ang += m / rt; c.save(); c.rotate(ang); c.translate(0, -rt); c.globalAlpha = s.pronto ? .45 : 1; c.fillText(ch, 0, 0); c.restore(); ang += (m + esp) / rt; });
  });
}

/* ═══════════ Encuadres de la cámara (origen 0 0: un punto x se ve en tx + s·x) ═══════════ */
let E = null;
function medir() {
  plano.style.transform = "none";
  const h = $("hueco").getBoundingClientRect();
  marca.style.fontSize = (h.width / .74) + "px";           // la O mide ya lo que medirá la ruleta
  const or = o.getBoundingClientRect(), mr = marca.getBoundingClientRect();
  const oc = [or.left + or.width / 2, or.top + or.height / 2];
  const margen = Math.max(16, innerWidth * .04);
  const k = (innerWidth - margen * 2) / mr.width;            // la palabra de borde a borde
  const baseY = innerHeight - Math.max(28, innerHeight * .05); // pegada abajo, como en Onform
  const ini = { s: k, tx: margen - k * mr.left, ty: baseY - k * mr.bottom };
  const fin = { s: 1, tx: h.left + h.width / 2 - oc[0], ty: h.top + h.height / 2 - oc[1] };
  E = { ini, fin, oc, ancho: h.width, letrasArriba: ini.ty + k * mr.top };
  $("desliza").style.top = (E.letrasArriba - 22) + "px";
  pintarDial(Math.min(2000, Math.round(h.width * 1.18 * Math.min(3, devicePixelRatio || 1))));
  pintar(progreso, true);
}
const mezcla = (a, b, t) => a + (b - a) * t;
const tramo = (p, a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));
const suave = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; // ease-in-out

/* ═══════════ El scroll manda: p va de 0 (portada) a 1 (ruleta) ═══════════ */
let progreso = 0, lista = false;
function pintar(p, forzar) {
  if (!E) return;
  const t = suave(tramo(p, .08, .92));
  // escala en logaritmo para que el acercamiento se sienta constante; la O viaja en línea recta
  const s = Math.exp(mezcla(Math.log(E.ini.s), 0, t));
  const ocI = [E.ini.tx + E.ini.s * E.oc[0], E.ini.ty + E.ini.s * E.oc[1]], ocF = [E.fin.tx + E.oc[0], E.fin.ty + E.oc[1]];
  const cx = mezcla(ocI[0], ocF[0], t), cy = mezcla(ocI[1], ocF[1], t);
  plano.style.transform = `translate(${cx - s * E.oc[0]}px, ${cy - s * E.oc[1]}px) scale(${s})`;
  // el vídeo se curva por abajo y sube, como en Onform
  const v = tramo(p, 0, .7), curva = Math.min(60, v * 140);
  video.style.clipPath = `inset(0 0 ${v * 100}% 0 round 0 0 ${curva}% ${curva}% / 0 0 ${v * 24}vw ${v * 24}vw)`;
  video.style.transform = `translateY(${-v * 12}%)`;
  // las letras se van; la O se queda
  const fuera = tramo(p, .25, .6);
  marca.querySelectorAll(".l").forEach((l) => { l.style.opacity = 1 - fuera; });
  const tx = 1 - tramo(p, 0, .15);
  $("desliza").style.opacity = tx;
  $("rosa").style.boxShadow = `0 0 0 ${.012 * (1 - t)}em rgba(243,234,216,.9)`;
  const ui = tramo(p, .86, 1);
  $("panel").style.opacity = ui; $("panel").style.transform = `translateY(${(1 - ui) * 12}px)`;
  $("aguja").style.opacity = ui; dial.style.opacity = tramo(p, .7, .95); $("sombra").style.opacity = ui; $("creditos").style.opacity = ui;
  const ahora = p > .97;
  if (ahora !== lista) {
    lista = ahora; $("panel").style.pointerEvents = $("creditos").style.pointerEvents = lista ? "auto" : "none"; o.tabIndex = lista ? 0 : -1; o.style.cursor = lista ? "grab" : "";
    if (lista) { try { localStorage.setItem("cz-portada-vista", "1"); } catch {} pistaGiro(); }
  }
}
let pedido = false;
function alScroll() {
  if (pedido) return; pedido = true;
  requestAnimationFrame(() => {
    pedido = false;
    const max = document.documentElement.scrollHeight - innerHeight;
    progreso = max > 0 ? Math.min(1, scrollY / max) : 1;
    pintar(progreso);
  });
}
addEventListener("scroll", alScroll, { passive: true });
// un toque en "Desliza" baja solo, para quien no lo pille
$("desliza").onclick = () => scrollTo({ top: document.documentElement.scrollHeight, behavior: reducir ? "auto" : "smooth" });

/* ═══════════ Ruleta: el dedo manda, proyección de inercia y muelle (física tipo iOS) ═══════════ */
let angulo = 0, vel = 0, objetivo = 0, elegida = -1, bucle = 0, tocado = false;
const indiceDe = (a) => ((Math.round(-a / PASO) % N) + N) % N;
function girar() {
  rosa.style.transform = dial.style.transform = `rotate(${angulo}deg)`;
  const i = indiceDe(angulo); if (i !== elegida) { elegida = i; mostrar(i); }
}
let tPrev = 0;
function paso(t) {
  const dt = Math.min(32, t - (tPrev || t)); tPrev = t;
  vel += (-(angulo - objetivo) * .000195 - vel * .0237) * dt; angulo += vel * dt;
  if (Math.abs(angulo - objetivo) < .02 && Math.abs(vel) < .002) { angulo = objetivo; vel = 0; girar(); bucle = 0; tPrev = 0; alParar(); return; }
  girar(); bucle = requestAnimationFrame(paso);
}
const mover = () => { if (!bucle) { tPrev = 0; bucle = requestAnimationFrame(paso); } };
function irA(i) { let d = ((i - indiceDe(angulo)) % N + N) % N; if (d > N / 2) d -= N; objetivo = Math.round(angulo / PASO) * PASO - d * PASO; mover(); }
let arr = null;
const angP = (e) => { const r = o.getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 180 / Math.PI; };
o.addEventListener("pointerdown", (e) => {
  if (!lista || arr) return; tocado = true;
  try { o.setPointerCapture(e.pointerId); } catch {}
  cancelAnimationFrame(bucle); bucle = 0; vel = 0; arr = { id: e.pointerId, ult: angP(e), m: [], x: e.clientX, y: e.clientY, t: performance.now(), movido: false, ang0: angulo };
  presionar(true); destino = -1;
});
o.addEventListener("pointermove", (e) => {
  if (!arr || e.pointerId !== arr.id) return;
  const a = angP(e); let d = a - arr.ult; if (d > 180) d -= 360; if (d < -180) d += 360;
  arr.ult = a;
  if (!arr.movido && Math.hypot(e.clientX - arr.x, e.clientY - arr.y) < 8) return; // aún puede ser un toque
  if (!arr.movido) { arr.movido = true; presionar(false); }
  angulo += d; girar();
  const t = performance.now(); arr.m.push([t, d]); arr.m = arr.m.filter(([x]) => t - x < 80);
});
const soltar = (e) => {
  if (!arr || (e && e.pointerId !== arr.id)) return;
  presionar(false);
  if (!arr.movido && e && e.type === "pointerup" && performance.now() - arr.t < 500) { const x = e.clientX, y = e.clientY; arr = null; tocar(x, y); return; }
  const m = arr.m, tot = m.reduce((s, [, d]) => s + d, 0), span = m.length > 1 ? m[m.length - 1][0] - m[0][0] : 0;
  vel = span > 6 ? Math.max(-3, Math.min(3, tot / span)) : 0;
  objetivo = Math.round((angulo + vel * .998 / (1 - .998)) / PASO) * PASO; arr = null; mover();
};
o.addEventListener("pointerup", soltar); o.addEventListener("pointercancel", soltar);
o.addEventListener("keydown", (e) => {
  if (!lista) return;
  const salto = (i) => { e.preventDefault(); cancelAnimationFrame(bucle); bucle = 0; let d = ((i - indiceDe(angulo)) % N + N) % N; if (d > N / 2) d -= N; angulo = objetivo = Math.round(angulo / PASO) * PASO - d * PASO; vel = 0; girar(); };
  if (["ArrowRight", "ArrowDown"].includes(e.key)) salto((elegida + 1) % N);
  if (["ArrowLeft", "ArrowUp"].includes(e.key)) salto((elegida - 1 + N) % N);
  if (e.key === "Enter") entrar();
});
// Hundir la rosa un pelín al pulsar: responde al dedo antes de que pase nada (escala 0,97, 140 ms)
let pulsada = false;
function presionar(si) {
  if (si === pulsada) return; pulsada = si;
  const k = si ? .97 : 1;
  rosa.style.scale = dial.style.scale = k;
}
// Toque: el gajo que hay debajo del dedo sube arriba con el muelle y, al llegar, entras
let destino = -1;
function tocar(x, y) {
  const r = o.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  if (Math.hypot(x - cx, y - cy) < r.width * .18) { entrar(); return; }        // el corazón de la rosa: entrar en lo elegido
  const a = (Math.atan2(y - cy, x - cx) * 180 / Math.PI + 90 - angulo + 720) % 360; // ángulo del toque sobre la rosa sin girar
  const i = ((Math.round(a / PASO) % N) + N) % N;
  if (i === elegida && !bucle) { entrar(); return; }
  destino = SECCIONES[i].pronto ? -1 : i;
  irA(i);
}
function alParar() { if (destino >= 0 && destino === elegida) { const d = destino; destino = -1; setTimeout(() => { if (elegida === d) entrar(); }, 160); } }
function pistaGiro() {
  if (reducir) return;
  const empujon = () => { vel = -.16; objetivo = Math.round(angulo / PASO) * PASO; mover(); };
  setTimeout(empujon, 400); setTimeout(() => { if (!tocado) empujon(); }, 4200);
}

/* ═══════════ Texto: la frase se enciende palabra a palabra, como en Casa Momo ═══════════ */
SECCIONES.forEach((s, i) => { const b = document.createElement("button"); b.className = "punto"; b.type = "button"; b.setAttribute("aria-label", s.completo); b.onclick = () => irA(i); $("puntos").appendChild(b); });
o.setAttribute("aria-valuemin", 1); o.setAttribute("aria-valuemax", N);
let turno = 0;
function mostrar(i) {
  const s = SECCIONES[i], yo = ++turno;
  $("nombre").textContent = s.nombre;
  const f = $("frase"); f.innerHTML = s.frase.split(" ").map((w) => `<span>${w}</span>`).join(" ");
  [...f.children].forEach((w, k) => setTimeout(() => { if (yo === turno) w.classList.add("on"); }, reducir ? 0 : 40 + k * 45));
  $("entrar").disabled = !!s.pronto; $("entrar").textContent = s.pronto ? "Muy pronto" : "Entrar";
  document.querySelectorAll(".punto").forEach((p, j) => p.setAttribute("aria-current", j === i));
  o.setAttribute("aria-valuenow", i + 1); o.setAttribute("aria-valuetext", s.completo);
  if (lista) { $("aguja").classList.add("tic"); setTimeout(() => $("aguja").classList.remove("tic"), 100); }
}
$("entrar").onclick = entrar;
function entrar() {
  const s = SECCIONES[elegida]; if (!s || s.pronto || !lista) return;
  // la cámara sigue hacia dentro de la rosa, funde a negro y se abre la sección
  const r = o.getBoundingClientRect(), z = 6;
  const zoom = $("escena").animate([{ transform: "none", opacity: 1 }, { transform: `scale(${z})`, opacity: 0 }],
    { duration: reducir ? 1 : 650, easing: "cubic-bezier(.7, 0, .84, 0)", fill: "forwards" });
  $("escena").style.transformOrigin = `${r.left + r.width / 2}px ${r.top + r.height / 2}px`;
  zoom.onfinish = () => { location.href = (s.nombre === "Planner" ? "/planner" : "/despensa") + location.search; };
}
// Al volver con "atrás" el navegador puede sacar la página de su caché con el zoom puesto: se quita
addEventListener("pageshow", (e) => { if (e.persisted) $("escena").getAnimations().forEach((a) => a.cancel()); });

/* ═══════════ Arranque ═══════════ */
addEventListener("resize", medir);
CZ.registrarVisita();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  medir(); girar();
  alScroll();
  const v = $("clip"); v.play && v.play().catch(() => {});
});
</script>
